name: Deploy BBC Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Verify hosting directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e
            APP="$HOME/domains/bugakbrawangcemerlang.com/public_html"

            test -f "$APP/artisan"
            test -f "$APP/index.php"
            test -d "$APP/resources/views"
            test -d "$APP/resources/lang"

            echo "Laravel project directory verified."

      - name: Deploy English translations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "resources/lang/en/home.php,resources/lang/en/projects_page.php,resources/lang/en/about.php"
          target: "domains/bugakbrawangcemerlang.com/public_html/resources/lang/en/"
          strip_components: 3
          overwrite: true

      - name: Deploy Indonesian translations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "resources/lang/id/home.php,resources/lang/id/projects_page.php,resources/lang/id/about.php"
          target: "domains/bugakbrawangcemerlang.com/public_html/resources/lang/id/"
          strip_components: 3
          overwrite: true

      - name: Deploy Projects page
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "resources/views/pages/projects.blade.php"
          target: "domains/bugakbrawangcemerlang.com/public_html/resources/views/pages/"
          strip_components: 3
          overwrite: true

      - name: Deploy Current Project section
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "resources/views/sections/current-project.blade.php"
          target: "domains/bugakbrawangcemerlang.com/public_html/resources/views/sections/"
          strip_components: 3
          overwrite: true

      - name: Deploy Organization section
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "resources/views/sections/about/organization.blade.php"
          target: "domains/bugakbrawangcemerlang.com/public_html/resources/views/sections/"
          strip_components: 3
          overwrite: true

      - name: Deploy built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "public/build/**"
          target: "domains/bugakbrawangcemerlang.com/public_html/public/"
          strip_components: 1
          overwrite: true

      - name: Verify deployed organization styles
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd "$HOME/domains/bugakbrawangcemerlang.com/public_html"
            CSS_FILE=$(php -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true); echo $manifest["resources/css/app.css"]["file"] ?? "";')
            test -n "$CSS_FILE"
            CSS="public/build/$CSS_FILE"
            test -s "$CSS"
            grep -Fq '.max-w-xs{' "$CSS"
            grep -Fq '.max-w-md{' "$CSS"
            grep -Fq '.border-slate-200\/80{' "$CSS"

      - name: Clear compiled Laravel views
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd "$HOME/domains/bugakbrawangcemerlang.com/public_html"
            php artisan view:clear
